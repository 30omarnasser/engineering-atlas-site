<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="t d">
  <title id="t">Conversation history of one agent run</title>
  <desc id="d">Seven messages stacked in order: the system prompt with tool descriptions, the user request, an assistant tool call to read_file, a user message carrying the tool result, an assistant tool call to edit_file, a user message carrying that result, and the final assistant answer. A bracket shows that the whole list is sent to the model on every call, so it grows with every step.</desc>
  <rect width="600" height="640" rx="14" fill="#ffffff"/>
  <text x="300" y="38" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f1f24">Conversation history of one agent run</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <!-- 1 system -->
    <rect x="24" y="62" width="470" height="62" rx="8" fill="#f1f1f4" stroke="#6b6b76" stroke-width="2"/>
    <text x="38" y="86" font-weight="700" fill="#3c3c43">1 · system</text>
    <text x="38" y="110" fill="#1f1f24">Role, tool descriptions, reply protocol</text>
    <!-- 2 user -->
    <rect x="24" y="134" width="470" height="62" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
    <text x="38" y="158" font-weight="700" fill="#174a85">2 · user</text>
    <text x="38" y="182" fill="#1f1f24">Open hello.py and add a multiply function.</text>
    <!-- 3 assistant tool call -->
    <rect x="24" y="206" width="470" height="62" rx="8" fill="#f3effb" stroke="#6f42c1" stroke-width="2"/>
    <text x="38" y="230" font-weight="700" fill="#55309a">3 · assistant (tool call)</text>
    <text x="38" y="254" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f1f24">tool: read_file({"filename": "hello.py"})</text>
    <!-- 4 tool result -->
    <rect x="24" y="278" width="470" height="62" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
    <text x="38" y="302" font-weight="700" fill="#1f5f24">4 · user (tool result)</text>
    <text x="38" y="326" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f1f24">tool_result({"content": "print(...)"})</text>
    <!-- 5 assistant tool call -->
    <rect x="24" y="350" width="470" height="62" rx="8" fill="#f3effb" stroke="#6f42c1" stroke-width="2"/>
    <text x="38" y="374" font-weight="700" fill="#55309a">5 · assistant (tool call)</text>
    <text x="38" y="398" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f1f24">tool: edit_file({"path": "hello.py", …})</text>
    <!-- 6 tool result -->
    <rect x="24" y="422" width="470" height="62" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
    <text x="38" y="446" font-weight="700" fill="#1f5f24">6 · user (tool result)</text>
    <text x="38" y="470" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f1f24">tool_result({"action": "edited"})</text>
    <!-- 7 final -->
    <rect x="24" y="494" width="470" height="62" rx="8" fill="#f3effb" stroke="#6f42c1" stroke-width="2"/>
    <text x="38" y="518" font-weight="700" fill="#55309a">7 · assistant (final answer)</text>
    <text x="38" y="542" fill="#1f1f24">Done. I added multiply(a, b) to hello.py.</text>
  </g>
  <!-- bracket -->
  <path d="M510 66 H526 V552 H510" fill="none" stroke="#b5462b" stroke-width="3"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#8f3520" font-weight="700">
    <text x="566" y="286" text-anchor="middle" transform="rotate(90 566 286)">Sent in full on every LLM call</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#3c3c43">
    <rect x="24" y="576" width="16" height="16" rx="3" fill="#f3effb" stroke="#6f42c1" stroke-width="2"/>
    <text x="48" y="589">model output</text>
    <rect x="170" y="576" width="16" height="16" rx="3" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
    <text x="194" y="589">tool output, sent back as a user message</text>
    <text x="24" y="622" font-size="14">Messages 3–6 exist only because the agent loop ran two tool steps.</text>
  </g>
</svg>
